[project]
name = "chair-watch"
version = "0.1.0"
description = "中古のシルフィー / アクトが 3 万円以内で出たら LINE に通知する"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chair_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
