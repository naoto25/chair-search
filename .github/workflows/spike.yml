# スパイク用（使い捨て）。LINE には送らずに main を 1 回実行し、通知される内容をログに出す。
name: spike

on:
  push:
    branches: [claude/chair-price-monitor-9ron48]
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv sync --extra browser
          uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      - name: 全サイトを「記録はあるが空」の状態から実行し、いま通知される出品を表示する
        run: |
          echo '{"sites": {"officebusters": {"items": {}, "failures": 0}, "bicreyouth": {"items": {}, "failures": 0}, "happy119": {"items": {}, "failures": 0}, "mercari": {"items": {}, "failures": 0}}}' > state.json
          uv run python -m chair_watch.main
          echo "===== state.json"
          cat state.json
