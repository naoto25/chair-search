name: watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: お試し送信（今の候補から 2 件を送るだけで、記録は変えない）
        type: boolean
        default: false

# 前回の実行が終わる前に次が始まって state.json を取り合わないようにする
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 依存とブラウザを入れる
        run: |
          uv sync --extra browser --no-dev
          uv run playwright install --with-deps chromium
      - name: 監視を 1 回実行する
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          CHAIR_WATCH_PREVIEW: ${{ inputs.preview }}
        run: uv run python -m chair_watch.main
      - name: state.json と detail_cache.json に変更があればコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json detail_cache.json
          git diff --cached --quiet && exit 0
          git commit -m "state: 監視結果を更新する"
          git push
